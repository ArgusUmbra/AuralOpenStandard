name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependency
        run: python -m pip install cryptography==50.0.1

      - name: Run Python test suite
        run: python -W error -m unittest discover -s tests -v

      - name: Run Node graph test suite
        run: node --test tests/test_node_provenance_graph.mjs
